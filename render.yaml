services:
  - type: web
    name: dealfold-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SERPAPI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
